<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساعت ۲۴ ساعته بازارهای مالی | Market24hClock.ir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: #000;
    color: #d4d8de;
    padding: 16px;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 950px) { body { grid-template-columns: 1fr; } }
  .clock-area { display: grid; place-items: center; min-height: 95vh; }
  .clock-svg {
    width: min(94vw, 94vh);
    height: min(94vw, 94vh);
    display: block;
    filter: drop-shadow(0 0 60px rgba(255,159,67,0.06));
  }
  .side { padding: 20px 0; }
  .side h1 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .side .sub { font-size: 11.5px; color: #7a8088; margin-bottom: 20px; }
  .country-label {
    font-size: 10px; color: #5f6774; margin: 16px 0 8px;
    letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
  }
  .country-label::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
  }
  .list-item {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 5px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer; transition: all 0.2s ease;
  }
  .list-item:hover { background: rgba(255,255,255,0.05); }
  .list-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .nm {
    font-size: 12.5px; color: #e8ecf1; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    font-size: 9.5px; padding: 3px 7px; border-radius: 5px;
    font-weight: 500; white-space: nowrap;
  }
  .badge.open   { background: rgba(34,197,94,0.15);  color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
  .badge.closed { background: rgba(120,128,136,0.1); color: #7a8088; border: 1px solid rgba(120,128,136,0.2); }
  .badge.soon   { background: rgba(255,159,67,0.15); color: #ff9f43; border: 1px solid rgba(255,159,67,0.3); }
  .badge.tal    { background: rgba(59,185,199,0.15); color: #3fb9c7; border: 1px solid rgba(59,185,199,0.3); }
  .hrs {
    display: flex; gap: 6px; font-size: 9.5px;
    direction: ltr; font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .hrs span {
    padding: 2px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.03); color: #7a8088;
  }
  .hrs .main  { color: #22c55e; }
  .hrs .pre   { color: #ff9f43; }
  .hrs .tal   { color: #3fb9c7; }
  .hrs .after { color: #4a9eff; }
</style>
</head>
<body>

<div class="clock-area">
  <svg class="clock-svg" viewBox="0 0 800 800" id="clockSvg"></svg>
</div>

<div class="side">
  <h1>Market24hClock.ir</h1>
  <p class="sub">ساعت زنده بازارهای مالی ایران و جهان</p>
  <div id="list"></div>
</div>

<script>
const CX = 400, CY = 400;
const NS = 'http://www.w3.org/2000/svg';

/* ===== بازارها ===== */
const MARKETS = [
  { id:'tse', faShort:'بورس تهران', fa:'بورس اوراق بهادار تهران',
    preOpen:8.75, open:9.0, close:12.5,
    talStart:12.75, talEnd:13.0,
    afterOpen:null, afterClose:null,
    color:'#ff9f43', country:'ir' },
  { id:'ifb', faShort:'فرابورس', fa:'فرابورس ایران',
    preOpen:8.75, open:9.0, close:12.5,
    talStart:12.75, talEnd:13.0,
    afterOpen:null, afterClose:null,
    color:'#e3b341', country:'ir' },
  { id:'base', faShort:'بازار پایه', fa:'بازار پایه (OTC)',
    preOpen:8.75, open:9.0, close:12.5,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#d97b7b', country:'ir' },
  { id:'deriv', faShort:'مشتقه سهام', fa:'مشتقه سهام',
    preOpen:8.75, open:9.0, close:12.52,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#3fb9c7', country:'ir' },
  { id:'fixed', faShort:'درآمد ثابت', fa:'صندوق‌های درآمد ثابت',
    preOpen:8.42, open:8.5, close:15.0,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#d99e3a', country:'ir' },
  { id:'reit', faShort:'املاک', fa:'صندوق املاک و مستغلات',
    preOpen:8.75, open:9.0, close:15.0,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#ffb366', country:'ir' },
  { id:'energy', faShort:'انرژی', fa:'صندوق کالایی انرژی',
    preOpen:10.75, open:11.0, close:15.0,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#e8797e', country:'ir' },
  { id:'gold', faShort:'طلا و زعفران', fa:'صندوق طلا، نقره، زعفران',
    preOpen:11.75, open:12.0, close:17.0,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#9b7bd4', country:'ir' },
  { id:'lse', faShort:'بورس لندن', fa:'بورس لندن',
    preOpen:7.0, open:8.0, close:16.5,
    talStart:null, talEnd:null,
    afterOpen:null, afterClose:null,
    color:'#4a9eff', country:'uk' },
  { id:'nyse', faShort:'بورس نیویورک', fa:'بورس نیویورک',
    preOpen:4.0, open:9.5, close:16.0,
    talStart:null, talEnd:null,
    afterOpen:16.0, afterClose:20.0,
    color:'#22c55e', country:'us' }
];

/* ===== ابعاد ===== */
const R_OUT = 322;
const RING_STEP = 22;
const RING_W = 17;
const EDGE_W = 4;
const R_NUM = 375;
const R_TICK_OUT = 358;
const R_TICK_IN = 344;
const R_MIN = 118;

/* ★ بازه‌ی فلیپ اعداد (نیمه‌ی پایین دیال) ★ */
const FLIP_FROM = 6;
const FLIP_TO   = 17;

/* ===== کمک‌تابع‌ها ===== */
function el(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function polar(r, h) {
  const a = (h / 24) * 2 * Math.PI - Math.PI / 2;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}
function arcCW(r, startH, endH) {
  let sweep = ((endH - startH) % 24 + 24) % 24;
  if (sweep < 0.005) sweep = 24;
  const la = sweep > 12 ? 1 : 0;
  const p1 = polar(r, startH);
  const p2 = polar(r, endH);
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${la} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}
function arcCCW(r, startH, endH) {
  let sweep = ((startH - endH) % 24 + 24) % 24;
  if (sweep < 0.005) sweep = 24;
  const la = sweep > 12 ? 1 : 0;
  const p1 = polar(r, startH);
  const p2 = polar(r, endH);
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${la} 0 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}

const svg = document.getElementById('clockSvg');
const defs = el('defs');
svg.appendChild(defs);

/* ===== پس‌زمینه ===== */
svg.appendChild(el('circle', { cx:CX, cy:CY, r:398, fill:'#000' }));
svg.appendChild(el('circle', { cx:CX, cy:CY, r:335, fill:'none', stroke:'rgba(55,60,68,0.35)', 'stroke-width':1 }));
svg.appendChild(el('circle', { cx:CX, cy:CY, r:280, fill:'none', stroke:'rgba(55,60,68,0.22)', 'stroke-width':1 }));

for (let h = 0; h < 24; h++) {
  const p = polar(335, h);
  svg.appendChild(el('line', {
    x1:CX, y1:CY, x2:p.x, y2:p.y,
    stroke:'rgba(55,60,68,0.18)', 'stroke-width':0.6
  }));
}

/* ===== اعداد ۰۱ تا ۲۴ ===== */
for (let h = 0; h < 24; h++) {
  const p = polar(R_NUM, h);
  const label = h === 0 ? '24' : String(h).padStart(2,'0');
  const naturalRot = (h / 24) * 360;
  const flip = (h >= FLIP_FROM && h <= FLIP_TO) ? 180 : 0;
  const rot = naturalRot + flip;

  const t = el('text', {
    x:p.x, y:p.y,
    'text-anchor':'middle', 'dominant-baseline':'central',
    fill:'#ffffff', 'font-size':30, 'font-weight':400,
    'font-family':'Georgia, "Times New Roman", serif',
    transform:`rotate(${rot} ${p.x} ${p.y})`
  });
  t.textContent = label;
  svg.appendChild(t);
}

/* ===== تیک‌های ساعت ===== */
for (let h = 0; h < 24; h++) {
  const p1 = polar(R_TICK_IN, h);
  const p2 = polar(R_TICK_OUT, h);
  svg.appendChild(el('line', {
    x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
    stroke:'rgba(255,255,255,0.6)', 'stroke-width':1.8, 'stroke-linecap':'round'
  }));
}
for (let h = 0; h < 24; h++) {
  const hh = h + 0.5;
  const p1 = polar(R_TICK_IN + 4, hh);
  const p2 = polar(R_TICK_OUT - 2, hh);
  svg.appendChild(el('line', {
    x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
    stroke:'rgba(255,255,255,0.22)', 'stroke-width':1
  }));
}

/* ===== نشانگرهای دقیقه ===== */
for (let m = 0; m <= 55; m += 5) {
  const pos = (m / 60) * 24;
  const p = polar(R_MIN, pos);
  const display = String(m).padStart(2, '0');
  const t = el('text', {
    x:p.x, y:p.y,
    'text-anchor':'middle', 'dominant-baseline':'central',
    fill:'rgba(90,200,120,0.75)', 'font-size':11,
    'font-family':'system-ui, sans-serif',
    'font-variant-numeric':'tabular-nums',
    direction:'ltr'
  });
  t.textContent = display;
  svg.appendChild(t);
}

/* ===== حلقه‌های بازارها ===== */
const arcMain  = {};
const arcPre   = {};
const arcTal   = {};
const arcAfter = {};
const marketGroups = {};

MARKETS.forEach((m, i) => {
  const r = R_OUT - i * RING_STEP;
  const group = el('g', { 'data-market': m.id });
  marketGroups[m.id] = group;

  group.appendChild(el('circle', {
    cx:CX, cy:CY, r:r, fill:'none',
    stroke:'rgba(55,60,68,0.55)', 'stroke-width':RING_W
  }));

  // کمان معاملات اصلی
  const main = el('path', {
    d: arcCW(r, m.open, m.close),
    fill:'none', stroke: m.color,
    'stroke-width': RING_W, 'stroke-linecap':'butt', opacity: 0.35
  });
  group.appendChild(main);
  arcMain[m.id] = main;

  // پیش‌گشایش
  if (m.preOpen < m.open) {
    const pre = el('path', {
      d: arcCW(r, m.preOpen, m.open),
      fill:'none', stroke: m.color,
      'stroke-width': EDGE_W, 'stroke-linecap':'butt', opacity: 0.55
    });
    group.appendChild(pre);
    arcPre[m.id] = pre;
  }

  // TAL
  if (m.talStart != null && m.talEnd != null) {
    const tal = el('path', {
      d: arcCW(r, m.talStart, m.talEnd),
      fill:'none', stroke: m.color,
      'stroke-width': EDGE_W, 'stroke-linecap':'butt', opacity: 0.55
    });
    group.appendChild(tal);
    arcTal[m.id] = tal;
  }

  // پس از ساعت (خط‌چین)
  if (m.afterOpen != null && m.afterClose != null) {
    const after = el('path', {
      d: arcCW(r, m.afterOpen, m.afterClose),
      fill:'none', stroke: m.color,
      'stroke-width': EDGE_W, 'stroke-linecap':'butt', opacity: 0.45,
      'stroke-dasharray': '3 3'
    });
    group.appendChild(after);
    arcAfter[m.id] = after;
  }

  // متن روی کمان
  const tpId = `tp-${m.id}`;
  const tpPath = el('path', {
    d: arcCCW(r, m.close, m.open),
    id: tpId, fill:'none'
  });
  defs.appendChild(tpPath);

  const txt = el('text', {
    'font-size': 10,
    'font-family': 'Vazirmatn, system-ui, sans-serif',
    'font-weight': 600,
    direction: 'rtl',
    'unicode-bidi': 'bidi-override'
  });
  const tpath = el('textPath', {
    href: `#${tpId}`,
    startOffset: '50%',
    'text-anchor': 'middle'
  });
  tpath.textContent = m.faShort;
  tpath.setAttribute('fill', '#e8ecf1');
  txt.appendChild(tpath);
  group.appendChild(txt);

  // دایره‌ی سبز توپر: شروع پیش‌گشایش
  const pPre = polar(r, m.preOpen);
  group.appendChild(el('circle', {
    cx:pPre.x, cy:pPre.y, r:4.5,
    fill:'#22c55e', stroke:'#000', 'stroke-width':1.5
  }));

  // دایره‌ی توخالی: پایان معاملات اصلی
  const pClose = polar(r, m.close);
  group.appendChild(el('circle', {
    cx:pClose.x, cy:pClose.y, r:4.5,
    fill:'none', stroke:'#22c55e', 'stroke-width':1.5, opacity:0.85
  }));

  // TAL — شروع و پایان
  if (m.talStart != null) {
    const pS = polar(r, m.talStart);
    group.appendChild(el('circle', {
      cx:pS.x, cy:pS.y, r:3.5,
      fill:'#22c55e', stroke:'#000', 'stroke-width':1
    }));
    const pE = polar(r, m.talEnd);
    group.appendChild(el('circle', {
      cx:pE.x, cy:pE.y, r:3.5,
      fill:'none', stroke:'#22c55e', 'stroke-width':1, opacity:0.7
    }));
  }

  // پس از ساعت — شروع و پایان
  if (m.afterOpen != null) {
    const pS = polar(r, m.afterOpen);
    group.appendChild(el('circle', {
      cx:pS.x, cy:pS.y, r:3,
      fill:'#22c55e', stroke:'#000', 'stroke-width':1, opacity:0.7
    }));
    const pE = polar(r, m.afterClose);
    group.appendChild(el('circle', {
      cx:pE.x, cy:pE.y, r:3,
      fill:'none', stroke:'#22c55e', 'stroke-width':1, opacity:0.5
    }));
  }

  svg.appendChild(group);
});

/* ===== عقربه‌ها ===== */
const hourHand = el('line', {
  x1:CX, y1:CY, x2:CX, y2:CY-92,
  stroke:'#b8bec6', 'stroke-width':6, 'stroke-linecap':'round', id:'hourHand'
});
svg.appendChild(hourHand);

const minuteHand = el('line', {
  x1:CX, y1:CY, x2:CX, y2:CY-155,
  stroke:'#dfe3e8', 'stroke-width':2.5, 'stroke-linecap':'round', id:'minuteHand'
});
svg.appendChild(minuteHand);

const secondHand = el('line', {
  x1:CX, y1:CY+24, x2:CX, y2:CY-185,
  stroke:'#22c55e', 'stroke-width':1.3, 'stroke-linecap':'round', id:'secondHand'
});
svg.appendChild(secondHand);

svg.appendChild(el('circle', {
  cx:CX, cy:CY, r:6, fill:'#0e0e0e', stroke:'#b8bec6', 'stroke-width':1.5
}));

/* ===== متن مرکزی ===== */
const centerTitle = el('text', {
  x:CX, y:CY-48,
  'text-anchor':'middle', 'dominant-baseline':'central',
  fill:'#ffffff', 'font-size':21, 'font-weight':700,
  'font-family':'Georgia, "Times New Roman", serif', 'letter-spacing':'0.3'
});
centerTitle.textContent = 'Market24hClock';
svg.appendChild(centerTitle);

const centerDot = el('text', {
  x:CX, y:CY-28,
  'text-anchor':'middle', 'dominant-baseline':'central',
  fill:'rgba(255,255,255,0.35)', 'font-size':9,
  'font-family':'system-ui, sans-serif'
});
centerDot.textContent = '.com';
svg.appendChild(centerDot);

const digitalTime = el('text', {
  x:CX, y:CY+38,
  'text-anchor':'middle', 'dominant-baseline':'central',
  fill:'#22c55e', 'font-size':15, 'font-weight':500,
  'font-family':'ui-monospace, Menlo, monospace',
  'font-variant-numeric':'tabular-nums', direction:'ltr'
});
digitalTime.textContent = '00:00:00';
svg.appendChild(digitalTime);

const tehranLabel = el('text', {
  x:CX, y:CY+58,
  'text-anchor':'middle', 'dominant-baseline':'central',
  fill:'rgba(255,255,255,0.4)', 'font-size':10,
  'font-family':'Vazirmatn, sans-serif'
});
tehranLabel.textContent = 'وقت ایران';
svg.appendChild(tehranLabel);

/* ===== زمان ===== */
function getTehran() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone:'Asia/Tehran', hour12:false,
    hour:'2-digit', minute:'2-digit', second:'2-digit', weekday:'short'
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  return { h:+get('hour')%24, m:+get('minute'), s:+get('second'), weekday:get('weekday') };
}
function isTradingDay(wd) { return ['Sat','Sun','Mon','Tue','Wed'].includes(wd); }
function formatHM(hm) {
  const h = Math.floor(hm);
  const m = Math.round((hm - h) * 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ===== به‌روزرسانی ===== */
function updateClock() {
  const t = getTehran();
  const hourH = t.h + t.m/60 + t.s/3600;
  const minH = t.m + t.s/60;
  const secH = t.s;

  const hA = (hourH / 24) * 360 - 90;
  const mA = (minH / 60) * 360 - 90;
  const sA = (secH / 60) * 360 - 90;

  const hR = hA * Math.PI / 180;
  const mR = mA * Math.PI / 180;
  const sR = sA * Math.PI / 180;

  hourHand.setAttribute('x2', CX + 92 * Math.cos(hR));
  hourHand.setAttribute('y2', CY + 92 * Math.sin(hR));
  minuteHand.setAttribute('x2', CX + 155 * Math.cos(mR));
  minuteHand.setAttribute('y2', CY + 155 * Math.sin(mR));
  secondHand.setAttribute('x2', CX + 185 * Math.cos(sR));
  secondHand.setAttribute('y2', CY + 185 * Math.sin(sR));
  secondHand.setAttribute('x1', CX - 24 * Math.cos(sR));
  secondHand.setAttribute('y1', CY - 24 * Math.sin(sR));

  digitalTime.textContent =
    `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}:${String(t.s).padStart(2,'0')}`;

  const tradingDay = isTradingDay(t.weekday);
  MARKETS.forEach(mk => {
    const inMain  = tradingDay && hourH >= mk.open && hourH < mk.close;
    const inPre   = tradingDay && hourH >= mk.preOpen && hourH < mk.open;
    const inTal   = mk.talStart && tradingDay && hourH >= mk.talStart && hourH < mk.talEnd;
    const inAfter = mk.afterOpen && tradingDay && hourH >= mk.afterOpen && hourH < mk.afterClose;

    if (inMain || inTal || inAfter) {
      arcMain[mk.id].setAttribute('stroke', mk.color);
      arcMain[mk.id].setAttribute('opacity', 1);
      arcMain[mk.id].style.filter = `drop-shadow(0 0 6px ${mk.color})`;
    } else if (inPre) {
      arcMain[mk.id].setAttribute('stroke', mk.color);
      arcMain[mk.id].setAttribute('opacity', 0.7);
      arcMain[mk.id].style.filter = `drop-shadow(0 0 3px ${mk.color})`;
    } else {
      arcMain[mk.id].setAttribute('stroke', 'rgba(90,96,105,0.6)');
      arcMain[mk.id].setAttribute('opacity', 0.85);
      arcMain[mk.id].style.filter = 'none';
    }
  });

  updateList(t);
}

/* ===== لیست کناری ===== */
function updateList(t) {
  const list = document.getElementById('list');
  const tradingDay = isTradingDay(t.weekday);
  const nowH = t.h + t.m/60 + t.s/3600;

  const groups = { ir: [], uk: [], us: [] };
  MARKETS.forEach(mk => groups[mk.country].push(mk));

  const labels = { ir: '🇮🇷 ایران', uk: '🇬🇧 لندن', us: '🇺🇸 نیویورک' };

  let html = '';
  ['ir','uk','us'].forEach(c => {
    if (!groups[c].length) return;
    html += `<div class="country-label">${labels[c]}</div>`;
    groups[c].forEach(mk => {
      let status = 'closed', label = 'بسته';
      if (tradingDay) {
        if (nowH >= mk.preOpen && nowH < mk.open) { status='soon'; label='پیش‌گشایش'; }
        else if (nowH >= mk.open && nowH < mk.close) { status='open'; label='باز'; }
        else if (mk.talStart && nowH >= mk.talStart && nowH < mk.talEnd) { status='tal'; label='TAL'; }
        else if (mk.afterOpen && nowH >= mk.afterOpen && nowH < mk.afterClose) { status='tal'; label='پس از ساعت'; }
      }

      let hrsHtml = `<span class="pre">${formatHM(mk.preOpen)}</span>`;
      hrsHtml += `<span class="main">${formatHM(mk.open)} – ${formatHM(mk.close)}</span>`;
      if (mk.talStart) hrsHtml += `<span class="tal">TAL ${formatHM(mk.talStart)}–${formatHM(mk.talEnd)}</span>`;
      if (mk.afterOpen) hrsHtml += `<span class="after">پس از ساعت ${formatHM(mk.afterOpen)}–${formatHM(mk.afterClose)}</span>`;

      html += `
        <div class="list-item" data-market="${mk.id}">
          <div class="list-row">
            <span class="sw" style="background:${mk.color}"></span>
            <span class="nm">${mk.fa}</span>
            <span class="badge ${status}">${label}</span>
          </div>
          <div class="hrs">${hrsHtml}</div>
        </div>
      `;
    });
  });

  list.innerHTML = html;

  list.querySelectorAll('.list-item').forEach(item => {
    item.addEventListener('mouseenter', () => {
      Object.keys(marketGroups).forEach(id => {
        if (id !== item.dataset.market) marketGroups[id].style.opacity = '0.15';
      });
    });
    item.addEventListener('mouseleave', () => {
      Object.values(marketGroups).forEach(g => g.style.opacity = '1');
    });
  });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
